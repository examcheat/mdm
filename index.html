{t:"Q3. 2.4 GHz Wi-Fi scan (WiFiman / Wi-Fi analyzer)",q:"Scan nearby 2.4 GHz networks at your assigned place:\nI. Record SSID, channel, RSSI and channel width of the lab Wi-Fi and nearby networks.\nII. Compare Channels 1, 6, 11 (number of networks, strongest competing RSSI).\nIII. Identify co-channel and overlapping networks w.r.t. the lab Wi-Fi.\nIV. Bar graph of networks on Channels 1, 6, 11.\nV. Recommend a channel and justify.",code:String.raw`import matplotlib.pyplot as plt

# I. Readings from WiFiman (REPLACE with YOUR readings): (SSID, channel, RSSI dBm, width MHz)
LAB = ('MWC_LAB_WiFi', 6, -45, 20)
nets = [LAB, ('Hostel_5', 1, -60, 20), ('CSE_Lab', 1, -72, 20), ('Library_AP', 6, -58, 20),
        ('Staff', 11, -66, 20), ('Guest', 11, -80, 20), ('Net_X', 3, -75, 20), ('Home', 9, -85, 20)]
print(f"{'SSID':15}{'Ch':>4}{'RSSI':>7}{'Width':>7}")
for s, c, r, w in nets: print(f'{s:15}{c:>4}{r:>7}{w:>7}')

# II. Compare channels 1, 6, 11 (competing = all networks except the lab network)
others = [n for n in nets if n != LAB]
chs = [1, 6, 11]
count = {c: sum(n[1] == c for n in nets) for c in chs}
strong = {c: max([n[2] for n in others if n[1] == c], default=-100) for c in chs}
for c in chs: print(f'Ch {c}: networks = {count[c]}, strongest competing RSSI = {strong[c]} dBm')

# III. Co-channel (same channel) and overlapping (channel difference < 5; 2.4 GHz channels are 5 MHz apart, 20 MHz wide)
co = [n[0] for n in others if n[1] == LAB[1]]
ov = [n[0] for n in others if 0 < abs(n[1] - LAB[1]) < 5]
print('Co-channel with lab:', co); print('Overlapping with lab:', ov)

# IV. Bar graph
plt.bar([str(c) for c in chs], [count[c] for c in chs], color=['tab:blue', 'tab:orange', 'tab:green'])
plt.xlabel('Channel'); plt.ylabel('Detected networks'); plt.title('Networks on Channels 1, 6, 11'); plt.show()

# V. Recommendation: fewest networks, then weakest competing RSSI
best = min(chs, key=lambda c: (sum(n[1] == c for n in others), strong[c]))
print('Recommended channel:', best, '-> fewest networks and weakest competing signal (least interference).')

# VIVA Q&A
# Q1. Why only channels 1, 6, 11? A: They are the only three non-overlapping 20 MHz channels in 2.4 GHz.
# Q2. What is RSSI? A: Received signal strength in dBm; closer to 0 is stronger (-45 strong, -85 weak).
# Q3. Co-channel vs adjacent-channel interference? A: Co-channel networks share airtime (CSMA/CA); overlapping ones corrupt each other's signal (worse).
# Q4. How many channels in 2.4 GHz? A: 14 (1-13 in India), spaced 5 MHz, each 20 MHz wide.
# Q5. Why is 5 GHz better? A: More non-overlapping channels, less congestion.`},
{t:"Q4. Wireless LAN in Cisco Packet Tracer (RTT, throughput)",q:"Configure a wireless LAN (router, server, laptop) through the GUI:\nI. Configure devices and establish connectivity.\nII. Record min, max, avg RTT with ping (default and 1500-byte).\nIII. Simulation Mode: record send/arrival timestamps for a 2000-byte payload.\nIV. Calculate total packet size, RTT interval, throughput (bps, kbps).\nV. Repeat 3 times, compare, comment on packet size vs latency.",code:String.raw`import numpy as np

# I. GUI STEPS (Packet Tracer)
# 1. Place Wireless Router (e.g. WRT300N), Server-PT, Laptop-PT. Connect Server to router LAN port (Copper Straight-Through).
# 2. Laptop: Physical tab -> power off, replace wired card with WMP300N wireless module, power on.
# 3. Router: GUI -> Wireless -> SSID = MWC_LAB, Setup -> DHCP enabled. Server: Config -> FastEthernet0 -> static IP 192.168.0.10.
# 4. Laptop: Config -> Wireless0 -> SSID MWC_LAB, IP via DHCP. Check: Desktop -> Command Prompt -> ping 192.168.0.10.

# II. Ping results (ms) - ENTER from Command Prompt: "ping 192.168.0.10" and "ping -l 1500 192.168.0.10"
ping = {'Default (32 B)': (3, 12, 6), '1500 B': (8, 25, 14)}          # (min, max, avg)
for k, (mn, mx, av) in ping.items(): print(f'{k}: min={mn} ms, max={mx} ms, avg={av} ms')

# III. Simulation Mode: use Capture/Forward on the ICMP packet (ping -l 2000); note send & arrival times (s)
trials = [(0.000, 0.012), (0.000, 0.014), (0.000, 0.011)]             # (t_send, t_arrive) - REPLACE

# IV. Calculations
payload = 2000                         # bytes
total = payload + 8 + 20 + 14          # + ICMP(8) + IP(20) + Ethernet(14) headers = 2042 bytes (adjust if you include 802.11 header)
tp = []
for n, (ts, ta) in enumerate(trials, 1):
    rtt = ta - ts                      # round-trip time interval (s)
    bps = total*8 / rtt                # throughput = bits / time
    tp.append(bps)
    print(f'Trial {n}: size={total} B, RTT={rtt*1000:.1f} ms, throughput={bps:.0f} bps = {bps/1000:.2f} kbps')

# V. Comparison
print(f'Average throughput = {np.mean(tp)/1000:.2f} kbps, spread = {np.ptp(tp)/1000:.2f} kbps')
# Comment: larger packets have higher RTT (more transmission time; 2000 B > MTU 1500 B so it is fragmented into 2 packets).
# Small differences between trials come from wireless medium access (CSMA/CA) and ARP in the first ping.

# VIVA Q&A
# Q1. What is RTT? A: Time for a packet to reach the destination and its reply to return.
# Q2. Why is the first ping slower / lost? A: ARP resolution (and DHCP/association) happens first.
# Q3. Throughput formula? A: Throughput = total bits transferred / time taken.
# Q4. Why does latency rise with packet size? A: Transmission delay = L/R grows with packet length L; fragmentation adds more.
# Q5. What is MTU? A: Maximum Transmission Unit - largest frame payload (1500 B for Ethernet).`},

{t:"Q7. Smartphone network diagnostics (RSRP, RSRQ, SINR)",q:"Using a smartphone diagnostic app at your assigned place:\nI. Record network type, RSRP, RSRQ and SINR.\nII. Record three readings at 1-minute intervals and calculate averages.\nIII. Classify signal strength and comment on quality.\nIV. Explain significance of RSRP, RSRQ and SINR.",code:String.raw`import numpy as np

# I & II. Readings (REPLACE with your app values, e.g. Network Cell Info / Network Signal Guru)
network = '4G (LTE)'
rsrp = [-92, -95, -93]                # dBm
rsrq = [-11, -12, -11]                # dB
sinr = [14, 12, 13]                   # dB
print('Network type:', network)
for m in range(3): print(f'Reading {m+1} (t={m} min): RSRP={rsrp[m]} dBm, RSRQ={rsrq[m]} dB, SINR={sinr[m]} dB')
a_p, a_q, a_s = np.mean(rsrp), np.mean(rsrq), np.mean(sinr)
print(f'Average RSRP={a_p:.1f} dBm, RSRQ={a_q:.1f} dB, SINR={a_s:.1f} dB')

# III. Classification (typical LTE thresholds)
def grade(v, lims):                   # lims: thresholds for Excellent / Good / Fair
    return 'Excellent' if v >= lims[0] else 'Good' if v >= lims[1] else 'Fair' if v >= lims[2] else 'Poor'
print('RSRP :', grade(a_p, (-80, -90, -100)))   # >=-80 Exc, -80..-90 Good, -90..-100 Fair, <-100 Poor
print('RSRQ :', grade(a_q, (-10, -15, -20)))    # >=-10 Exc, -10..-15 Good, -15..-20 Fair, <-20 Poor
print('SINR :', grade(a_s, (20, 13, 0)))        # >=20 Exc, 13..20 Good, 0..13 Fair, <0 Poor
# Comment: write overall quality, e.g. "Signal is Fair-Good: usable for browsing/video, speed moderate."

# IV. SIGNIFICANCE
# RSRP (Reference Signal Received Power): average power of LTE reference signals; measures coverage / distance from tower.
# RSRQ (Reference Signal Received Quality) = N*RSRP/RSSI; measures quality, accounting for interference and load.
# SINR (Signal to Interference plus Noise Ratio): directly decides data rate and modulation (higher SINR -> 64/256-QAM).

# VIVA Q&A
# Q1. Difference between RSRP and RSSI? A: RSSI is total wideband power (signal+noise+interference); RSRP is only reference-signal power.
# Q2. Good RSRP value? A: Better than -90 dBm; below -110 dBm is very poor.
# Q3. Why can RSRP be good but speed low? A: Low SINR/RSRQ due to interference or heavy load.
# Q4. What decides handover? A: RSRP/RSRQ comparison of serving vs neighbour cell.
# Q5. 5G equivalents? A: SS-RSRP, SS-RSRQ, SS-SINR.`},
{t:"Q8. WLAN security in Cisco Packet Tracer (WPA2 and MAC filtering)",q:"Configure a wireless LAN through the GUI:\nI. Router with SSID MWC_LAB, connect two laptops, verify with ping.\nII. WPA2-Personal (AES), password MWC@12345; authorized laptop connects, wrong password is rejected.\nIII. Enable MAC filtering to permit only the authorized laptop.\nIV. Record connection and ping results in an observation table.\nV. Explain how WPA2 and MAC filtering improve security.",code:String.raw`# I. GUI STEPS (Packet Tracer)
# 1. Add Wireless Router + 2 Laptop-PT; replace wired card with WMP300N in both laptops.
# 2. Router -> GUI -> Wireless -> SSID = MWC_LAB. Laptops: Config -> Wireless0 -> SSID MWC_LAB (DHCP). Ping router/other laptop.
# II. Router -> Wireless -> Security -> WPA2-Personal, Encryption = AES, Passphrase = MWC@12345.
#     Laptop1: Authentication WPA2-PSK, PSK = MWC@12345 -> connects.  Laptop2: PSK = wrong123 -> rejected.
# III. Router -> Wireless -> Wireless MAC Filter -> Enabled, "Permit PCs listed below", add Laptop1 MAC
#      (Laptop -> Config -> Wireless0 -> MAC Address). Laptop2 (even with correct password) must fail.

# IV. Observation table (update Result/Ping with what you actually observe)
rows = [('Open network (no security)', 'Laptop1', 'Connected', 'Success'),
        ('Open network (no security)', 'Laptop2', 'Connected', 'Success'),
        ('WPA2-PSK (correct password)', 'Laptop1', 'Connected', 'Success'),
        ('WPA2-PSK (wrong password)',   'Laptop2', 'Rejected',  'Failed (request timed out)'),
        ('WPA2 + MAC filter',           'Laptop1 (authorized)',   'Connected', 'Success'),
        ('WPA2 + MAC filter',           'Laptop2 (unauthorized)', 'Rejected',  'Failed (request timed out)')]
print(f"{'Security stage':30}{'Laptop':24}{'Connection':13}{'Ping'}")
for r in rows: print(f'{r[0]:30}{r[1]:24}{r[2]:13}{r[3]}')

# V. EXPLANATION
# WPA2-Personal: client and router share a pre-shared key (PSK); a 4-way handshake derives unique session keys,
#   and AES-CCMP encrypts all frames, so only users with the password can join and eavesdropping is prevented.
# MAC filtering: router accepts only listed hardware addresses, adding a second layer (device authorization).
#   It is weak alone because MAC addresses can be spoofed, so it is used together with WPA2.

# VIVA Q&A
# Q1. WPA2 vs WEP? A: WEP uses weak RC4/static keys and is easily cracked; WPA2 uses AES-CCMP and a 4-way handshake.
# Q2. What is SSID? A: Service Set Identifier - the name of the wireless network.
# Q3. What is a MAC address? A: 48-bit unique hardware address of a network interface.
# Q4. Why is the wrong-password laptop rejected? A: It derives a different key, so the handshake fails.
# Q5. Personal vs Enterprise? A: Personal uses a shared password; Enterprise uses 802.1X/RADIUS with per-user credentials.`}

/* ---- build ONE copyable block: Theory / Program / Output / Conclusion (all non-program parts as # comments) ---- */
function wrap(s,w){return s.split('\n').flatMap(l=>{if(l.length<=w)return [l];const o=[];let cur='';l.split(' ').forEach(x=>{if((cur?cur+' '+x:x).length>w){o.push(cur);cur=x}else cur=cur?cur+' '+x:x});o.push(cur);return o})}
const cm=(s,w=95)=>wrap(s,w).map(l=>l?'# '+l:'#').join('\n');
const bar='# '+'='.repeat(70);
const sect=n=>bar+'\n# '+n+'\n'+bar;
function full(i){
 const x=Q[i],e=X[i],pt=(i==3||i==7),p=[];
 p.push(sect(x.t));
 p.push(cm('QUESTION:\n'+x.q));
 if(e.th)p.push(sect('THEORY (Optional)')+'\n'+cm(e.th));
 let prog=sect(pt?'PACKET TRACER NETWORK STEPS + CALCULATION PROGRAM':'PYTHON PROGRAM');
 if(e.net)prog+='\n'+cm('NETWORK (TOPOLOGY): '+e.net);
 p.push(prog+'\n\n'+x.code);
 p.push(sect('OUTPUT / OBSERVATION TABLE')+'\n'+cm(e.out,1e9));
 p.push(sect('CONCLUSION')+'\n'+cm(e.con));
 return p.join('\n\n')+'\n';
}

const nb=document.getElementById('nb');
const tick=()=>{document.getElementById('clk').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};tick();setInterval(tick,30000);
function hl(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/(#.*)|((?:f|r)?"[^"\n]*"|(?:f|r)?'[^'\n]*')|\b(import|from|as|def|for|in|if|else|elif|return|print|True|False|None|and|or|not|while|range|lambda|continue|next)\b|\b(\d+\.?\d*)\b/g,
(m,c,s,k,n)=>c?'<i class=c>'+m+'</i>':s?'<i class=s>'+m+'</i>':k?'<i class=k>'+m+'</i>':'<i class=n>'+m+'</i>');}
async function copy(text){try{await navigator.clipboard.writeText(text);return 1}catch(e){const a=document.createElement('textarea');a.value=text;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();return ok}}
Q.forEach((x,i)=>{
 const code=full(i);
 const t=document.createElement('div');t.className='txt';
 t.innerHTML='<div><h2></h2><span class="lb">Given Question</span><p></p></div><button class="cp">⧉ Copy code</button>';
 t.querySelector('h2').textContent=x.t;t.querySelector('p').textContent=x.q;
 const c=document.createElement('div');c.className='cell';
 c.innerHTML='<div class="idx">['+(i+1)+']<br><b>✓</b> 0s</div><div class="box"><div class="ftb"><span>↑</span><span>↓</span><span>✎</span><span>✕</span><span>⋮</span></div><div class="cb"><button class="run" title="Copy code">▶</button><pre></pre></div></div>';
 c.querySelector('pre').innerHTML=hl(code);
 const go=async()=>{const ok=await copy(code);const cp=t.querySelector('.cp');cp.textContent=ok?'✓ Copied!':'Press Ctrl+C';cp.classList.toggle('ok',!!ok);setTimeout(()=>{cp.textContent='⧉ Copy code';cp.classList.remove('ok')},1800)};
 t.querySelector('.cp').onclick=go;c.querySelector('.run').onclick=go;
 nb.append(t,c);
});
</script></body></html>
